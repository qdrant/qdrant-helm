{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "qdrant.fullname" . }}
  labels:
    {{- include "qdrant.labels" . | nindent 4 }}
    {{- include "qdrant.additionalLabels" . | nindent 4 }}
{{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  {{- $minAvailable := .Values.podDisruptionBudget.minAvailable }}
  {{- $maxUnavailable := .Values.podDisruptionBudget.maxUnavailable }}
  {{- if and (not (kindIs "invalid" $minAvailable)) (ne (toString $minAvailable) "") }}
  minAvailable: {{ $minAvailable }}
  {{- else if and (not (kindIs "invalid" $maxUnavailable)) (ne (toString $maxUnavailable) "") }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- end }}
  {{- with  .Values.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "qdrant.selectorLabels" . | nindent 6 }}
{{- end }}
